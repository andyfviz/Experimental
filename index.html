<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Coding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Righteous&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <!--SECCION 1-->
    <section class="section-1">
    <!-- BACKGROUND-->
     <div class="scene-wrapper" id="scene">
        <div class="bg-noise" aria-hidden="true"></div>
        <div class="layer" id="l1" data-base-x="0" data-base-y="100"> <!-- SVG 1 → más lejano --> 
            <img src="data/ilustraciones/BG01.svg" style="width:116%; height:116%; object-fit:contain;">
        </div>
        <div class="layer" id="l2" data-base-x="0" data-base-y="10"> <!-- SVG 2 -->
            <img src="data/ilustraciones/BG02.svg" style="width:110%; height:116%; object-fit:cover;">
             </div>
     <!--Izquierda-->
      <aside class ="sidebar-left">
         <h3>Estilos</h3>
        <div id="Button-LightDark">
             <button id ="Theme">Dark</button>
         </div>
      </aside>
     <!--CENTER-->
     <main class ="main-content">
        <div class="page-title-container">
         <span class="page-title left">Hello</span>
         <span class="page-title right">World!</span>
         </div>
        </main>
    </div>
     </section>
     <!-- Puente: altura 0 en el flujo; el GIF se superpone a la costura 1↔2 -->
     <div class="section-bridge" aria-hidden="true">
       <img class="float-asset a1" src="data/lumi/dancinLUMI.gif" alt="dancing lumi" />
     </div>
     <!--SECCION 2-->
        <section class="section-2">
            <!--RIGHT-->
                <h3>Interacciones</h3>
                <div class="Tarjetas">
                    <div class="card">
                        <div class="card_img">
                            <img src="data/tarjeta_01.jpg" alt="Tarjeta 01">
                            <button class="add">Add</button>
                        </div>
                        <div class="card-info">
                            <h4>Producto 1</h4>
                            <p>$25</p>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card_img">
                            <img src="data/tarjeta02.jpg" alt="Tarjeta 02">
                            <button class="add">Add</button>
                        </div>
                        <div class="card-info">
                            <h4>Producto 2</h4>
                            <p>$30</p>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card_img">
                            <img src="data/tarjeta03.jpg" alt="Tarjeta 03">
                            <button class="add">Add</button>
                        </div>
                        <div class="card-info">
                            <h4>Producto 3</h4>
                            <p>$40</p>
                        </div>
                    </div>
                </div>
                <div class = 'pomodoro'>
                    <h2 id = 'mode-label'>Working Time!</h2>
                <div id='timer'>25:00</div>
                <div class = 'controls'>
                    <button id="start">START</button>
                    <button id="reset">RESET</button>
                </div>
                </div>
                <audio id="alarm" src="data/old-tune.wav"></audio>
        </section>
    
    <script src="main.js"></script>
</body>
</html>
